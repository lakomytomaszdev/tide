# PT-184: propozycja do zatwierdzenia; ten plik nie jest dowodem zgody ani udanej budowy.
tide-box: 1
project: legalapp
stacks: [dotnet, docker, playwright]
# Narzędzia czerwonej listy: brak programu nie może udawać odmowy granicy.
apt: [dnsutils, netcat-openbsd, iproute2, dbus]
dotnet:
  sdk: [10.0.100]
docker:
  enabled: true
  images: [pgvector/pgvector:pg16]
# Domeny stosów pochodzą z szablonów. api.sejm.gov.pl wymaga osobnego profilu karty.
network:
  domains: []
verify:
  - dotnet build
notes: "Propozycja PT-184; Playwright .NET 1.52.0; budowa z --worktree wskazującym czysty worktree LegalApp."
